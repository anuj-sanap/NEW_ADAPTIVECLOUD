services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: adaptivecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptivecloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptivecloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: adaptivecloud-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@postgres:5432/adaptivecloud
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app   # Hot reload in dev (remove in prod override)

  # ── ML Service ───────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: adaptivecloud-ml
    restart: unless-stopped
    env_file:
      - ../ml/.env
    volumes:
      - ml_models:/app/models  # Persist trained model artefacts
    ports:
      - "8001:8001"
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: adaptivecloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro   # Built React SPA
    depends_on:
      - backend

  # ── Wazuh Manager ───────────────────────────────────────────────────────────
  # Uncomment when ready to enable Wazuh SIEM integration
  # wazuh-manager:
  #   image: wazuh/wazuh-manager:4.9.2
  #   container_name: adaptivecloud-wazuh
  #   restart: unless-stopped
  #   ports:
  #     - "1514:1514/udp"   # Agent communication
  #     - "1515:1515"       # Agent enrollment
  #     - "55000:55000"     # Wazuh REST API
  #   volumes:
  #     - wazuh_data:/var/ossec/data
  #     - ./wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro

volumes:
  postgres_data:
  ml_models:
  # wazuh_data:
