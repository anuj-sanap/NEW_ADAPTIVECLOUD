services:
  # ── PostgreSQL 16 Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: adaptivecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptivecloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptivecloud"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── FastAPI Backend API ──────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: adaptivecloud-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@postgres:5432/adaptivecloud
    volumes:
      - wazuh_alerts:/var/ossec/logs/alerts:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  # ── Frontend Web Application (Placeholder / Built SPA) ──────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: adaptivecloud-frontend
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Nginx SSL Reverse Proxy & Gateway ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: adaptivecloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Wazuh 4.x SIEM Manager (Single-node, alerts.json only) ───────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: adaptivecloud-wazuh
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"   # Agent event reporting
      - "1514:1514/udp"
      - "1515:1515/tcp"   # Agent enrollment service
      - "55000:55000/tcp" # Management API
    environment:
      - INDEXER_URL=none
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_alerts:/var/ossec/logs/alerts
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

volumes:
  postgres_data:
  wazuh_data:
  wazuh_alerts:
