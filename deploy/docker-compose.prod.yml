# ==============================================================================
# AdaptiveCloud - Production Hardened Docker Compose Stack
# Tuned for GCP Free Trial e2-medium (2 vCPU, 4GB RAM) or Bare Metal Control Node
# ==============================================================================
services:
  # ── PostgreSQL 16 Relational Engine ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: adaptivecloud-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: adaptivecloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adaptivecloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── FastAPI Application Backend (REST + WebSockets + ML Inference) ──────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: adaptivecloud-backend-prod
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/adaptivecloud
    volumes:
      - wazuh_alerts:/var/ossec/logs/alerts:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\").read()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 896M
        reservations:
          cpus: "0.50"
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── React 18 + Vite SPA Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: adaptivecloud-frontend-prod
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ── Nginx TLS Reverse Proxy & Rate Limiter ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: adaptivecloud-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Wazuh 4.x SIEM Manager (Alerts Aggregator) ──────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: adaptivecloud-wazuh-prod
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"   # Wazuh agent telemetry stream
      - "1514:1514/udp"
      - "1515:1515/tcp"   # Wazuh agent enrollment service
      - "55000:55000/tcp" # Wazuh internal REST API
    environment:
      - INDEXER_URL=none
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_alerts:/var/ossec/logs/alerts
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
  wazuh_data:
  wazuh_alerts:

