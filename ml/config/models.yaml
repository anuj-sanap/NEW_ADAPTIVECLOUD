# ==============================================================================
# AdaptiveCloud - ML Models & Hyperparameters Configuration
# Reproducible configurations with seeded random states (seed: 42)
# Supports XGBoost, LightGBM, Random Forest, Isolation Forest
# ==============================================================================

seed: 42

models:
  # ── Multi-Class Attack Classifiers ─────────────────────────────────────────
  xgboost:
    type: "xgboost"
    description: "Extreme Gradient Boosting multi-class classifier"
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "multi:softprob"
      eval_metric: "mlogloss"
      random_state: 42
      n_jobs: -1
      tree_method: "hist"

  lightgbm:
    type: "lightgbm"
    description: "Light Gradient Boosting Machine classifier"
    params:
      n_estimators: 100
      num_leaves: 31
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "multiclass"
      metric: "multi_logloss"
      random_state: 42
      n_jobs: -1
      verbose: -1

  random_forest:
    type: "random_forest"
    description: "Ensemble Random Forest classifier"
    params:
      n_estimators: 100
      max_depth: 16
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1

  # ── Unsupervised Anomaly Detectors ──────────────────────────────────────────
  isolation_forest:
    type: "isolation_forest"
    description: "Isolation Forest for unsupervised zero-day anomaly scoring"
    params:
      n_estimators: 100
      max_samples: "auto"
      contamination: 0.03
      random_state: 42
      n_jobs: -1

  one_class_svm:
    type: "one_class_svm"
    description: "Non-linear kernel boundary anomaly estimator"
    params:
      kernel: "rbf"
      gamma: "scale"
      nu: 0.05
